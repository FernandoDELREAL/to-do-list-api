name: Provision infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_repo_url: ${{ github.server_url }}/${{ github.repository }}.git
      TF_VAR_ssh_public_key: ${{ secrets.EC2_SSH_PUBLIC_KEY }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para poder leer los tags

      - name: Version a desplegar (ultimo tag o main)
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            echo "TF_VAR_git_ref=$TAG"     >> "$GITHUB_ENV"
            echo "TF_VAR_app_version=$TAG" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_git_ref=main"        >> "$GITHUB_ENV"
            echo "TF_VAR_app_version=v0.0.0"  >> "$GITHUB_ENV"
          fi
          echo "Version: ${TAG:-main (sin tags)}"

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Verificar credenciales de AWS
        run: aws sts get-caller-identity

      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform apply -auto-approve -input=false

      - name: Outputs
        run: |
          {
            echo "## Infraestructura lista"
            echo '```'
            terraform output
            echo '```'
            echo "La app tarda ~2-3 min en levantar (user_data). RDS puede tardar un poco mas."
          } >> "$GITHUB_STEP_SUMMARY"
