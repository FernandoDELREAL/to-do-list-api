name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r src/requirements.txt -r tests/requirements-dev.txt

      - name: Correr pruebas
        run: pytest -v
